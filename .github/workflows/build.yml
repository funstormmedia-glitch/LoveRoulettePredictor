name: Build Love Roulette APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LoveRoulettePredictor_European_NumberColor_Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Extract project
        run: unzip -o LoveRoulettePredictor_European_NumberColor_Source.zip -d project
      - name: Build APK
        run: |
          cd project
          yes | /tmp/gradle-8.9/bin/gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LoveRoulette-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
